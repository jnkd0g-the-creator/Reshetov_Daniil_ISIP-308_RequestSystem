name: CoffeeDesk regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python scripts/run_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            testing/lab10/test_run.txt
            testing/lab10/junit.xml
            testing/lab10/coverage.xml
            testing/lab10/run_metadata.json
