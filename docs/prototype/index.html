<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoffeeDesk · интерактивный прототип</title>
<style>
:root{--green:#244d3b;--ink:#23362d;--muted:#758077;--paper:#f6f5f0;--line:#e3e6de;--accent:#c18b54}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,.button{display:inline-flex;align-items:center;justify-content:center;padding:11px 19px;border:1px solid var(--line);border-radius:9px;background:white;cursor:pointer;gap:8px}button:focus-visible,a:focus-visible{outline:3px solid #cb9959;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.danger{color:#a43632}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#183b2c;color:#e4eee7;padding:35px 22px;display:flex;flex-direction:column}.brand{font-size:25px;font-weight:bold;letter-spacing:-1px}.brand span{color:#d5b080}.tag{font-size:11px;color:#b4c7b9;text-transform:uppercase;letter-spacing:2px;margin:5px 0 42px}nav a{display:block;padding:13px 16px;margin:6px 0;border-radius:8px;color:#c5d7ca}nav a.active{background:#30533f;color:white}aside small{margin-top:auto;color:#9cb4a2;padding:16px 8px}.workspace{padding:0 42px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);height:91px;color:var(--muted);font-size:13px}.avatar{display:inline-flex;align-items:center;gap:12px;color:var(--ink)}.avatar b{display:grid;place-items:center;width:36px;height:36px;background:#e5e9dd;border-radius:50%;font-size:12px}.prototype{background:#fff3d9;color:#80591b;padding:7px 12px;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:center;margin:32px 0 23px}h1{font-size:30px;letter-spacing:-.7px;margin:0 0 6px}h2{font-size:18px;margin:0 0 16px}p{margin:0 0 16px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:#977148;margin-bottom:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}.stat,.card{background:white;border:1px solid var(--line);border-radius:12px;padding:23px}.stat strong{font-size:31px;display:block;margin:8px 0}.stat small{color:var(--muted)}.filters{display:flex;gap:12px;padding:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.filters input{flex:1;min-width:180px}.table-card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}input,select,textarea{border:1px solid #dce1d7;border-radius:8px;padding:11px 12px;background:white;color:var(--ink);width:100%}select{width:auto}textarea{min-height:125px;resize:vertical}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:15px 20px;background:#fcfcf9}td{padding:19px 20px;border-top:1px solid #eff0ea;font-size:13px}td strong{display:block;font-size:14px;margin-bottom:3px}td small{color:var(--muted)}.number{color:#8c988d;font-size:12px}.badge{display:inline-block;white-space:nowrap;border-radius:20px;padding:5px 10px;font-size:12px}.new{background:#eff0ec;color:#667165}.work{background:#fff1d9;color:#986518}.done{background:#e9f2e8;color:#4d7952}.closed{background:#e8ecef;color:#66727e}.urgent{color:#ab543b}.foot{padding:15px 20px;color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}.form{max-width:820px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:13px;font-weight:bold;margin:0 0 7px}.field{margin-bottom:21px}.field small{display:block;margin-top:6px;color:var(--muted);font-size:12px}.field select{width:100%}.actions{display:flex;justify-content:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:20px}.notice{border-radius:8px;background:#f2f5ed;padding:14px;color:#68765f;font-size:13px;margin-bottom:20px}.error{background:#fff0ec;color:#a13b2a}.meta{display:grid;grid-template-columns:110px 1fr;gap:14px;font-size:13px}.meta dt{color:var(--muted)}.meta dd{margin:0}.timeline{border-left:2px solid #dfe7dc;padding-left:20px;margin:20px 0;color:#73806f;font-size:13px}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login-story{background:#183b2c;color:white;padding:70px;display:flex;flex-direction:column;justify-content:center}.login-story h1{font-size:49px;line-height:1.16;margin:35px 0 20px}.login-story p{color:#b6c8ba;max-width:380px}.login-form{display:grid;place-items:center;padding:35px}.login-form .card{width:410px;padding:36px}.login-form button{width:100%}.empty{padding:55px;text-align:center}.modal{display:none;position:fixed;inset:0;background:#10261dcc;place-items:center}.modal.open{display:grid}.modal .card{max-width:480px}footer{margin-top:28px;color:#8c958a;font-size:12px}@media(max-width:900px){.app{grid-template-columns:1fr}aside{padding:18px}.tag,aside small{display:none}nav{display:flex;flex-wrap:wrap}.workspace{padding:0 18px 25px}.two,.login-wrap{grid-template-columns:1fr}.login-story{display:none}.stats{gap:8px}.stat{padding:15px}td,th{padding:12px 9px}.grid{grid-template-columns:1fr}.table-card{overflow:auto}.heading{align-items:flex-start;gap:15px}h1{font-size:25px}.filters select{max-width:100%}}
</style>
</head>
<body><div id="root"></div><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><div class="card"><h2 id="confirm-title">Архивировать CB-00004?</h2><p>Закрытая заявка исчезнет из рабочего списка. История сохранится.</p><div class="actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="closeModal();location.hash='list'">Подтвердить архив</button></div></div></div>
<script>
const root=document.querySelector('#root');
const nav=()=>`<aside><a class="brand" href="#list">☕ Coffee<span>Desk</span></a><div class="tag">Забота о вашем баре</div><nav><a class="active" href="#list">▤ &nbsp; Все заявки</a><a href="#new">＋ &nbsp; Создать заявку</a><a href="#empty">◯ &nbsp; Пустое состояние</a><a href="#error">⚠ &nbsp; Ошибка формы</a><a href="#login">↪ &nbsp; Экран входа</a></nav><small>Сервис начинается с деталей.<br>CoffeeDesk · учебный проект</small></aside>`;
function shell(content){return `<div class="prototype">Интерактивный прототип · вымышленные данные · без подключения к БД</div><div class="app">${nav()}<main class="workspace"><header><span>Рабочее пространство / Заявки</span><span class="avatar">Администратор <b>АД</b></span></header>${content}<footer>COFFEEDESK / СИСТЕМА УЧЁТА ЗАЯВОК КОФЕ-БАРОВ</footer></main></div>`}
const heading=(title,sub,action='')=>`<div class="heading"><div><div class="eyebrow">Техническая служба</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`;
const categories='<option>Сантехника</option><option>Кофейное оборудование</option><option>Электрика</option><option>Мебель</option><option>Хозяйственные работы</option>';
const cafes='<option>Центр</option><option>Парк</option><option>Вокзал</option>';
const filters=`<div class="filters"><input aria-label="Поиск" placeholder="Поиск по номеру, теме или описанию"><select aria-label="Статус"><option>Все статусы</option><option>Новая</option><option>В работе</option><option>Выполнена</option><option>Закрыта</option></select><select aria-label="Категория"><option>Все категории</option>${categories}</select><button onclick="location.hash='empty'">Найти</button></div>`;
function list(empty=false){let rows=[['CB-00001','Протекает кран у мойки','Центр · Сантехника','В работе','work','Высокий','Мастер 1'],['CB-00002','Кофемашина не набирает давление','Парк · Кофейное оборудование','Новая','new','Срочный','Не назначен'],['CB-00003','Не горит свет над барной стойкой','Вокзал · Электрика','Выполнена','done','Обычный','Мастер 2'],['CB-00004','Заменить повреждённый стул','Центр · Мебель','Закрыта','closed','Низкий','Мастер 1']];return shell(heading('Заявки кофе-баров','Всё, что нужно для бесперебойной работы.',`<a class="button primary" href="#new">＋ Создать заявку</a>`)+`<div class="stats"><div class="stat">Открытые заявки<strong>8</strong><small>Требуют внимания команды</small></div><div class="stat">В работе<strong>4</strong><small>Уже занимаемся решением</small></div><div class="stat">Выполнено<strong>3</strong><small>Ожидают подтверждения</small></div></div><div class="table-card">${filters}${empty?'<div class="empty"><h2>Заявок не найдено</h2><p class="muted">Попробуйте другой запрос или сбросьте фильтры.</p><a class="button" href="#list">Сбросить фильтры</a></div>':`<table><thead><tr><th>Заявка</th><th>Статус</th><th>Приоритет</th><th>Исполнитель</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="number">${r[0]}</span><strong><a href="#detail">${r[1]}</a></strong><small>${r[2]}</small></td><td><span class="badge ${r[4]}">${r[3]}</span></td><td>${r[5]}</td><td>${r[6]}</td><td><a href="#detail" aria-label="Открыть ${r[0]}">→</a></td></tr>`).join('')}</tbody></table><div class="foot">Показаны 4 из 12 заявок · обновлено сегодня</div>`}</div>`)}
function form(edit=false,error=false){return shell(heading(edit?'Редактирование заявки':'Новая заявка',edit?'CB-00001 · изменения сохранятся в истории.':'Расскажите о проблеме — мы поможем её решить.',`<a class="button" href="#list">← К списку</a>`)+`<div class="card form"><form onsubmit="event.preventDefault();location.hash='detail'">${error?'<div class="notice error" role="alert">Проверьте тему: нужно от 3 до 120 символов. Данные не сохранены.</div>':'<div class="notice">Если ситуация аварийная, сначала свяжитесь с ответственным по телефону.</div>'}<div class="field"><label for="title">Тема заявки *</label><input id="title" required minlength="3" maxlength="120" placeholder="Например: протекает кран у мойки" value="${edit?'Протекает кран у мойки':''}"><small>Коротко опишите проблему · 3–120 символов</small></div><div class="grid"><div class="field"><label for="cafe">Кофе-бар *</label><select id="cafe">${cafes}</select></div><div class="field"><label for="category">Категория *</label><select id="category">${categories}</select></div></div><div class="field"><label for="description">Описание *</label><textarea id="description" required minlength="10" maxlength="4000" placeholder="Где возникла проблема, когда её заметили, как она влияет на работу">${edit?'Вода подтекает из соединения крана у рабочей мойки. Нужна замена уплотнения.':''}</textarea><small>От 10 до 4000 символов. Не указывайте персональные данные.</small></div><div class="field"><label for="priority">Приоритет</label><select id="priority"><option>Обычный</option><option>Высокий</option><option>Срочный</option><option>Низкий</option></select></div><div class="actions"><a class="button" href="${edit?'#detail':'#list'}">Отмена</a><button class="primary">${edit?'Сохранить изменения':'Создать заявку'}</button></div></form></div>`)}
function detail(){return shell(heading('Протекает кран у мойки','CB-00001 · создана 12 ноября 2026, 09:15',`<a class="button" href="#edit">Редактировать</a>`)+`<div class="two"><section><div class="card"><h2>Описание проблемы</h2><p>Вода подтекает из соединения крана у рабочей мойки. Нужна замена уплотнения. Проблему заметили в начале смены.</p><span class="badge work">В работе</span></div><div class="card" style="margin-top:20px"><h2>Обсуждение и история</h2><div class="timeline">09:15 · Заявитель создал заявку<br><br>09:30 · Оператор назначил Мастера 1<br><br>09:35 · Новая → В работе</div><label for="comment">Новый комментарий</label><textarea id="comment" placeholder="Уточните детали или сообщите о результате"></textarea><button class="primary" style="margin-top:12px" onclick="alert('Прототип: комментарий добавлен')">Отправить</button></div></section><section><div class="card"><h2>Детали заявки</h2><dl class="meta"><dt>Кофе-бар</dt><dd>Центр</dd><dt>Категория</dt><dd>Сантехника</dd><dt>Приоритет</dt><dd class="urgent">Высокий</dd><dt>Заявитель</dt><dd>Бариста 1</dd><dt>Исполнитель</dt><dd>Мастер 1</dd></dl><label for="assignee">Назначение</label><select id="assignee"><option>Мастер 1</option><option>Мастер 2</option></select><button style="margin-top:12px">Назначить</button></div><div class="card" style="margin-top:20px"><h2>Управление</h2><button class="primary" onclick="alert('Прототип: статус изменён')">Отметить выполнение</button><p class="muted" style="margin-top:12px;font-size:12px">Архив доступен администратору только после закрытия заявки.</p><button onclick="document.querySelector('#modal').classList.add('open')">Пример подтверждения архива</button></div></section></div>`)}
function login(){return `<div class="login-wrap"><section class="login-story"><div class="brand">☕ Coffee<span>Desk</span></div><h1>Меньше поломок.<br>Больше хорошего<br>кофе.</h1><p>Единое пространство заботы о ваших кофе-барах. От первого обращения до решённой проблемы.</p><small>Учебный интерактивный прототип</small></section><section class="login-form"><div class="card"><div class="eyebrow">С возвращением</div><h1>Вход в CoffeeDesk</h1><p class="muted">Используйте рабочую учётную запись.</p><form onsubmit="event.preventDefault();location.hash='list'"><div class="field"><label for="username">Логин</label><input id="username" autocomplete="username" placeholder="Ваш логин"></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="Введите пароль"></div><button class="primary">Войти →</button></form><p class="muted" style="font-size:12px;margin-top:20px">Нет доступа? Обратитесь к администратору.<br>Прототип: кнопка входа не проверяет пароль.</p></div></section></div>`}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
function render(){const route=location.hash.slice(1)||'login';root.innerHTML=route==='login'?login():route==='list'?list():route==='empty'?list(true):route==='new'?form():route==='edit'?form(true):route==='error'?form(false,true):detail();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
