<text x="77" y="294" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">fetch + CSRF</text>
<rect x="55" y="500" width="360" height="150" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
