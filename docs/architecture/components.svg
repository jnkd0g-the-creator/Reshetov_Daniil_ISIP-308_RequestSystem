<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<rect width="100%" height="100%" fill="#f7f5f0"/>
<text x="50" y="67" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#183e35">CoffeeDesk · диаграмма компонентов</text>
<rect x="55" y="160" width="360" height="200" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="77" y="202" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">Web UI</text>
<text x="77" y="240" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Вход, список, формы</text>
