<text x="1082" y="645" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">users, requests, catalogs</text>
<text x="1082" y="672" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">comments, history, sessions</text>
<text x="1082" y="699" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">параметризованный SQL</text>
