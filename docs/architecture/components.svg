<text x="1082" y="210" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">9 таблиц</text>
<text x="1082" y="237" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">FK + ограничения</text>
<text x="1082" y="264" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">schema.sql / seed.sql</text>
