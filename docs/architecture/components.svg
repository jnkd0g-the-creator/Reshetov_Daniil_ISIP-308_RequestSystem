<text x="77" y="607" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">OpenAPI contract</text>
<rect x="535" y="260" width="400" height="200" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="557" y="302" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">FastAPI controllers</text>
<text x="557" y="340" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">auth, requests, catalogs</text>
<text x="557" y="367" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">HTTP → service</text>
<text x="557" y="394" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">единый формат ошибок</text>
<rect x="535" y="565" width="400" height="200" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="557" y="607" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">Services</text>
<text x="557" y="645" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">RequestService, AuthService</text>
<text x="557" y="672" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Роли, статусы, назначение</text>
<text x="557" y="699" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Комментарии и аудит</text>
<rect x="1060" y="565" width="380" height="200" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
