<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="970" viewBox="0 0 1500 970">
<rect width="100%" height="100%" fill="#f7f5f0"/>
<text x="50" y="67" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#183e35">CoffeeDesk · слоистая архитектура</text>
<rect x="90" y="115" width="930" height="150" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="112" y="157" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">1 · Presentation / controller</text>
<text x="112" y="195" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">HTML/CSS/JS + FastAPI routes</text>
<text x="112" y="222" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">HTTP, JSON, cookie, коды, доступ к сервисам</text>
<polyline points="545,265 545,300" fill="none" stroke="#29634d" stroke-width="5"/>
<text x="570" y="290" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">↓</text>
<rect x="90" y="310" width="930" height="150" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="112" y="352" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">2 · Service</text>
<text x="112" y="390" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">AuthService / RequestService</text>
<text x="112" y="417" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Права, валидация, переходы, атомарные сценарии</text>
<polyline points="545,460 545,495" fill="none" stroke="#29634d" stroke-width="5"/>
<text x="570" y="485" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">↓</text>
<rect x="90" y="505" width="930" height="150" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="112" y="547" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">3 · Repository / data access</text>
<text x="112" y="585" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Repository + unit of work</text>
<text x="112" y="612" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Параметризованный SQL, чтение и запись</text>
<polyline points="545,655 545,690" fill="none" stroke="#29634d" stroke-width="5"/>
<text x="570" y="680" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">↓</text>
<rect x="90" y="700" width="930" height="150" rx="16" fill="#ffffff" stroke="#557d6e" stroke-width="2"/>
<text x="112" y="742" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">4 · Database</text>
<text x="112" y="780" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">SQLite · schema.sql</text>
<text x="112" y="807" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">FK, CHECK, UNIQUE, индексы, персистентность</text>
<rect x="1080" y="150" width="360" height="610" rx="16" fill="#e8eee5" stroke="#557d6e" stroke-width="2"/>
<text x="1102" y="192" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">Границы</text>
<text x="1102" y="230" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Controller: без SQL</text>
<text x="1102" y="257" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Service: без HTML</text>
<text x="1102" y="284" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Repository: без ролей</text>
<text x="1102" y="311" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Database: без UI</text>
<text x="1102" y="338" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459"></text>
<text x="1102" y="365" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Тесты изолируют БД.</text>
<text x="1102" y="392" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Настройки через env.</text>
<text x="1102" y="419" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Транзакция на сценарий.</text>
<text x="1102" y="446" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#496459">Один процесс записи.</text>
<text x="90" y="938" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#213c35">Зависимости направлены вниз; API и веб-интерфейс используют одни бизнес-правила.</text>
</svg>